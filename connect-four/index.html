<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="../theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Connect Four</h1>
      <div class="header-actions">
        <a class="back-link" href="../index.html">← Games</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <span class="theme-icon sun" aria-hidden="true">☀️</span>
          <span class="theme-icon moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <main class="game-panel">
      <div class="settings">
        <div class="setting-group">
          <label class="setting-label" for="gameMode">Mode</label>
          <select class="select" id="gameMode">
            <option value="cpu" selected>vs AI</option>
            <option value="pvp">2 Players</option>
          </select>
        </div>
        <div class="setting-group" id="difficultyGroup">
          <label class="setting-label" for="difficulty">Difficulty</label>
          <select class="select" id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <div class="player-bar">
        <div class="player-chip" id="humanIndicator">
          <span class="chip-dot human"></span>
          <span id="humanLabel">You (Red)</span>
        </div>
        <div class="player-chip" id="aiIndicator">
          <span class="chip-dot ai"></span>
          <span id="aiLabel">AI (Yellow)</span>
        </div>
      </div>

      <p class="status" id="status">Click any column — your piece drops to the bottom</p>

      <div class="scores">
        <span><strong id="scoreLabelHuman">You</strong> <span id="humanScore">0</span></span>
        <span class="score-divider">·</span>
        <span><strong id="scoreLabelAi">AI</strong> <span id="aiScore">0</span></span>
        <span class="score-divider">·</span>
        <span>Draws <span id="drawScore">0</span></span>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="Connect Four board"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="newGame">New Game</button>
        <button type="button" class="btn btn-primary" id="resetScore">Reset Score</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
